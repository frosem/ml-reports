name: Cypress Tests with Allure Reports & Jira Integration

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allows manual triggering

# Required permissions for deploying to GitHub Pages
permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run Cypress tests and generate Allure results
      - name: Run Cypress tests with Allure
        id: cypress
        continue-on-error: true
        run: npm run test:allure

      # Generate HTML Allure report from test results
      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # Upload Allure results as artifacts for debugging
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # Upload Allure report as artifacts for download
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Create Jira bugs automatically for any test failures
      - name: Create Jira bugs for test failures
        if: failure() || steps.cypress.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: npx tsx scripts/create-jira-bugs.ts

      # Deploy Allure report to GitHub Pages
      # Note: For first-time deployment, ensure the gh-pages branch exists.
      # If it doesn't exist, the peaceiris/actions-gh-pages action will create it automatically.
      # Alternatively, you can manually create it with:
      #   git checkout --orphan gh-pages
      #   git rm -rf .
      #   git commit --allow-empty -m "Initial gh-pages commit"
      #   git push origin gh-pages
      # This step uses the GITHUB_TOKEN for authentication, which is automatically provided by GitHub Actions.
      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report

      # Add test results summary to GitHub Actions summary page
      - name: Test Results Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cypress.outcome }}" == "success" ]; then
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Check Allure report for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📋 Jira bugs have been created for failed tests." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report)" >> $GITHUB_STEP_SUMMARY
