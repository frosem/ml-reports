name: Cypress Tests with Allure Reports & Jira Integration

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on (leave empty for current branch)'
        required: false
        type: string

# Required permissions for deploying to GitHub Pages
permissions:
  contents: write

env:
  NODE_VERSION: '20'
  # Sanitize branch name: replace / with - for valid directory names
  BRANCH_NAME: ${{ github.event.inputs.branch || github.ref_name }}

jobs:
  setup:
    name: Setup Configuration
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.get-node-version.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Node version from package.json
        id: get-node-version
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "Error: package.json file not found"
            exit 1
          fi
          NODE_VERSION=$(jq -r '.engines.node' package.json)
          if [ -z "$NODE_VERSION" ] || [ "$NODE_VERSION" = "null" ]; then
            echo "Error: engines.node not found in package.json"
            exit 1
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "Detected Node version: $NODE_VERSION"

  cypress-tests:
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run Cypress tests and generate Allure results
      - name: Run Cypress tests with Allure
        id: cypress
        continue-on-error: true
        run: npm run test:allure

      # Generate HTML Allure report from test results
      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # Upload Allure results as artifacts for debugging
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # Upload Allure report as artifacts for download
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Create Jira bugs automatically for any test failures
      - name: Create Jira bugs for test failures
        if: failure() || steps.cypress.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: npx tsx scripts/create-jira-bugs.ts

      # Sanitize branch name for use as directory (replace / with -)
      - name: Sanitize branch name
        id: sanitize
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          echo "branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      # Deploy Allure report to GitHub Pages
      # Each branch gets its own subdirectory under /allure-report/<branch-name>/
      # This allows viewing reports from multiple branches without overwriting each other
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report/${{ steps.sanitize.outputs.branch }}
          keep_files: true

      # Add test results summary to GitHub Actions summary page
      - name: Test Results Summary
        if: always()
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ env.BRANCH_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cypress.outcome }}" == "success" ]; then
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Check Allure report for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📋 Jira bugs have been created for failed tests." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Allure Report for this branch](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report/${SANITIZED_BRANCH})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📂 [View all branch reports](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report/)" >> $GITHUB_STEP_SUMMARY
