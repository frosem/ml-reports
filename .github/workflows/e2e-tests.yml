name: E2E Tests Report

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Test framework to run'
        required: true
        default: 'playwright'
        type: choice
        options:
          - cypress
          - playwright
      create_bug_reports:
        description: 'Create bug reports in Jira for failed tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  e2e-tests:
    uses: ./.github/workflows/shared-e2e.yml
    with:
      framework: ${{ inputs.framework }}
      deploy_dir: allure-report
      create_bug_reports: ${{ inputs.create_bug_reports }}
      show_permanent_link: true
    secrets:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
