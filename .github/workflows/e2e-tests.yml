name: E2E Tests Report

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Test framework to run'
        required: true
        default: 'playwright'
        type: choice
        options:
          - cypress
          - playwright
      create_bug_reports:
        description: 'Create bug reports in Jira for failed tests'
        required: false
        default: false
        type: boolean

# Required permissions for deploying to GitHub Pages
permissions:
  contents: write

env:
  BRANCH_NAME: ${{ github.ref_name }}
  FRAMEWORK: ${{ inputs.framework }}
  RUN_ID: ${{ github.run_id }}

jobs:
  setup:
    name: Setup Configuration
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.get-node-version.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Node version from package.json
        id: get-node-version
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "Error: package.json file not found"
            exit 1
          fi
          NODE_VERSION=$(jq -r '.engines.node' package.json)
          if [ -z "$NODE_VERSION" ] || [ "$NODE_VERSION" = "null" ]; then
            echo "Error: engines.node not found in package.json"
            exit 1
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "Detected Node version: $NODE_VERSION"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright: Install browsers
      - name: Install Playwright browsers
        if: ${{ inputs.framework == 'playwright' }}
        run: npx playwright install --with-deps chromium

      # Run tests and generate Allure results
      - name: Run ${{ inputs.framework }} tests with Allure Reports
        id: tests
        continue-on-error: true
        run: npm run ${{ inputs.framework }}:test

      # Checkout gh-pages to get previous report history
      - name: Get previous Allure results history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Copy previous history to allure-results
      - name: Copy previous history
        if: always()
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          FRAMEWORK="${{ inputs.framework }}"
          HISTORY_DIR="gh-pages/allure-report/${SANITIZED_BRANCH}/${FRAMEWORK}/history"
          if [ -d "$HISTORY_DIR" ]; then
            mkdir -p "allure-results/${FRAMEWORK}/history"
            cp -r "$HISTORY_DIR"/* "allure-results/${FRAMEWORK}/history/" 2>/dev/null || true
            echo "Copied ${FRAMEWORK} history from previous report"
          else
            echo "No previous ${FRAMEWORK} history found"
          fi

      # Generate Allure report with history
      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate -- ${{ inputs.framework }}

      # Upload Allure results as artifacts for debugging
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.framework }}
          path: allure-results/${{ inputs.framework }}/
          retention-days: 30

      # Upload Allure report as artifacts for download
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.framework }}
          path: allure-report/${{ inputs.framework }}/
          retention-days: 30

      # Create bug reports in Jira for any test failures (only if flag is enabled)
      - name: Create bug reports in Jira for test failures
        id: jira
        if: (failure() || steps.tests.outcome == 'failure') && inputs.create_bug_reports == true
        env:
          ALLURE_RESULTS_DIR: ./allure-results/${{ inputs.framework }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        run: npm run jira:create-bugs

      # Sanitize branch name for use as directory (replace / with -)
      - name: Sanitize branch name
        id: sanitize
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          echo "branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      # Prepare combined deployment (report + history at branch/framework)
      - name: Prepare deployment structure
        id: deploy-prep
        if: always()
        run: |
          SANITIZED_BRANCH="${{ steps.sanitize.outputs.branch }}"
          FRAMEWORK="${{ inputs.framework }}"
          RUN_ID="${{ env.RUN_ID }}"
          ROOT_PATH="gh-pages/allure-report/${SANITIZED_BRANCH}/${FRAMEWORK}"
          
          mkdir -p deploy-package

          # 1. Deploy current report to {branch}/{framework}/{run-id}
          mkdir -p "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}"
          cp -r "allure-report/${FRAMEWORK}"/* "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}/"
          echo "✅ Current report deployed to: ${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}"

          # 2. Deploy current report to root (always overwrite with latest)
          cp -r "allure-report/${FRAMEWORK}"/* "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/"
          echo "✅ Root path updated with current report (latest status)"

          # 3. Find the previous run-id (penultimate) for the summary link
          if [ -d "${ROOT_PATH}" ]; then
            PREVIOUS_RUN_ID=$(find "${ROOT_PATH}" -maxdepth 1 -type d -name '[0-9]*' | sort -n | tail -1 | xargs basename 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_RUN_ID" ]; then
              echo "previous_run_id=${PREVIOUS_RUN_ID}" >> $GITHUB_OUTPUT
              echo "📂 Found previous run: ${PREVIOUS_RUN_ID}"
            else
              echo "previous_run_id=" >> $GITHUB_OUTPUT
              echo "📍 No previous run found (first run)"
            fi
          else
            echo "previous_run_id=" >> $GITHUB_OUTPUT
            echo "📍 First run on this branch"
          fi

          echo ""
          echo "📦 Deployment structure:"
          find "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/" -maxdepth 2 -type d | head -20

      # Single deploy to avoid race conditions
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          destination_dir: allure-report
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_dir: ./deploy-package

      # Add test results summary to GitHub Actions summary page
      - name: E2E Reports Summary
        if: always()
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report"
          PREVIOUS_RUN_ID="${{ steps.deploy-prep.outputs.previous_run_id }}"
          FRAMEWORK="${{ inputs.framework }}"
          
          # Framework-specific icon and badge
          if [ "$FRAMEWORK" == "cypress" ]; then
            FRAMEWORK_ICON='<img src="https://www.cypress.io/favicon.svg" alt="Cypress" width="20" height="20" />'
            FRAMEWORK_BADGE='![Cypress](https://img.shields.io/badge/-Cypress-69D3A7?logo=cypress&logoColor=white&style=flat-square)'
          else
            FRAMEWORK_ICON='<img src="https://playwright.dev/img/playwright-logo.svg" alt="Playwright" width="20" height="20" />'
            FRAMEWORK_BADGE='![Playwright](https://img.shields.io/badge/-Playwright-2EAD33?logo=data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMiAyQzYuNDggMiAyIDYuNDggMiAxMnM0LjQ4IDEwIDEwIDEwIDEwLTQuNDggMTAtMTBTMTcuNTIgMiAxMiAyem0tMiAxNWwtNS01IDEuNDEtMS40MUwxMCAxNC4xN2w3LjU5LTcuNTlMMTkgOGwtOSA5eiIvPjwvc3ZnPg==&logoColor=white&style=flat-square)'
          fi
          ALLURE_BADGE='![Allure](https://img.shields.io/badge/Allure-Reports-FF5722?logo=data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMiAyQzYuNDggMiAyIDYuNDggMiAxMnM0LjQ4IDEwIDEwIDEwIDEwLTQuNDggMTAtMTBTMTcuNTIgMiAxMiAyem0wIDE4Yy00LjQxIDAtOC0zLjU5LTgtOHMzLjU5LTggOC04IDggMy41OSA4IDgtMy41OSA4LTggOHoiLz48L3N2Zz4=)'
          
          # Header with badges
          echo "# 📊 E2E Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${FRAMEWORK_BADGE} ${ALLURE_BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test info table with framework icon (no headers)
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | ${FRAMEWORK_ICON} \`${FRAMEWORK}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ env.BRANCH_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Status badge
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "> ✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ **Some tests failed.** Check the report for details." >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.create_bug_reports }}" == "true" ]; then
              ISSUE_LINKS="${{ steps.jira.outputs.issue_links }}"
              if [ -n "$ISSUE_LINKS" ]; then
                echo ">" >> $GITHUB_STEP_SUMMARY
                echo "> 📋 **Bug reports created in Jira:** ${ISSUE_LINKS}" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Separator
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Report links section with Allure icon
          ALLURE_ICON='<img src="https://avatars.githubusercontent.com/u/5879127" alt="Allure" width="20" height="20" />'
          echo "## ${ALLURE_ICON} Report Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🔗 [Report for this run](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK}/${{ env.RUN_ID }})" >> $GITHUB_STEP_SUMMARY
          echo ">" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "> 📂 [Report for previous run](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK}/${PREVIOUS_RUN_ID})" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "> 📊 [Review latest report (permanent link)](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK})" >> $GITHUB_STEP_SUMMARY
