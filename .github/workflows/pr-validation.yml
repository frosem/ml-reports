name: PR validation checks

on:
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install editorconfig-checker
        run: |
          curl -O -L -C - https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.0.3/ec-linux-amd64.tar.gz
          tar xzf ec-linux-amd64.tar.gz
          chmod +x bin/ec-linux-amd64

      - name: Check indentation
        run: |
          ./bin/ec-linux-amd64 \
            --exclude "node_modules" \
            --exclude "package-lock.json" \
            --exclude "allure-results" \
            --exclude "allure-report" \
            --exclude "cypress/videos" \
            --exclude "cypress/screenshots"

      - name: Type check
        run: npm run typecheck

  run-modified-tests:
    name: Run Modified Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get modified spec files
        id: changed-specs
        run: |
          CYPRESS_SPECS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^cypress/e2e/.*\.specs\.ts$' | tr '\n' ',' | sed 's/,$//' || true)
          PLAYWRIGHT_SPECS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^playwright/tests/.*\.specs\.ts$' | tr '\n' ' ' || true)

          echo "cypress_specs=$CYPRESS_SPECS" >> $GITHUB_OUTPUT
          echo "playwright_specs=$PLAYWRIGHT_SPECS" >> $GITHUB_OUTPUT

          if [ -n "$CYPRESS_SPECS" ]; then
            echo "has_cypress=true" >> $GITHUB_OUTPUT
            echo "📝 Modified Cypress specs: $CYPRESS_SPECS"
          else
            echo "has_cypress=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$PLAYWRIGHT_SPECS" ]; then
            echo "has_playwright=true" >> $GITHUB_OUTPUT
            echo "📝 Modified Playwright specs: $PLAYWRIGHT_SPECS"
          else
            echo "has_playwright=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.changed-specs.outputs.has_cypress == 'true' || steps.changed-specs.outputs.has_playwright == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changed-specs.outputs.has_cypress == 'true' || steps.changed-specs.outputs.has_playwright == 'true'
        run: npm ci

      - name: Run modified Cypress specs
        if: steps.changed-specs.outputs.has_cypress == 'true'
        run: |
          npm run cypress:install
          npx cypress run --browser chrome --spec "${{ steps.changed-specs.outputs.cypress_specs }}"

      - name: Run modified Playwright specs
        if: steps.changed-specs.outputs.has_playwright == 'true'
        run: |
          npm run playwright:install
          npx playwright test ${{ steps.changed-specs.outputs.playwright_specs }}
