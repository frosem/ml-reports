name: PR Validation

on:
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  node-build:
    name: Build & Cache Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Cache dependencies to speed up workflow and reduce npm registry calls
      # Caches both node_modules and Cypress binary based on package-lock.json hash
      - name: node_modules and Cypress cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/
            ~/.cache/Cypress
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: [node-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Restore cached dependencies from the build job
      - name: node_modules and Cypress cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/
            ~/.cache/Cypress
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      # Validate TypeScript code for type errors without emitting output files
      # This catches type-related issues early in the PR process
      - name: Type check
        run: npx tsc --noEmit

  cypress-verify:
    name: Validate Cypress Config
    runs-on: ubuntu-latest
    needs: [node-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Restore cached dependencies from the build job
      - name: node_modules and Cypress cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/
            ~/.cache/Cypress
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      # Ensure Cypress binary is installed in the cache directory
      # This is necessary because Cypress requires a separate binary installation
      - name: Ensure Cypress binary exists
        run: npx cypress install

      # Verify that Cypress is properly installed and can run
      # This catches configuration or installation issues before running actual tests
      - name: Verify Cypress
        run: npx cypress verify

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [cypress-verify, type-check]
    if: always()
    steps:
      # Generate a summary of all validation checks for easy PR review
      # This appears on the GitHub Actions summary page
      - name: Generate Summary
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.type-check.result }}" == "success" ]; then
            echo "✅ TypeScript type check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ TypeScript type check failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.cypress-verify.result }}" == "success" ]; then
            echo "✅ Cypress configuration valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cypress configuration invalid" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Run the full test suite manually via **Actions → Cypress Tests → Run workflow**" >> $GITHUB_STEP_SUMMARY
