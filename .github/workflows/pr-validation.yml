name: PR validation checks

on:
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install editorconfig-checker
        run: |
          curl -O -L -C - https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.0.3/ec-linux-amd64.tar.gz
          tar xzf ec-linux-amd64.tar.gz
          chmod +x bin/ec-linux-amd64

      - name: Check indentation
        run: |
          ./bin/ec-linux-amd64 \
            --exclude "node_modules" \
            --exclude "package-lock.json" \
            --exclude "allure-results" \
            --exclude "allure-report" \
            --exclude "cypress/videos" \
            --exclude "cypress/screenshots"

      - name: Type check
        run: npm run typecheck

  validate-frameworks:
    name: Validate Frameworks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install and verify Cypress
        run: |
          npm run cypress:install
          npm run cypress:verify

      - name: Install and verify Playwright
        run: |
          npm run playwright:install
          npm run playwright:verify
