name: PR validation checks

on:
  pull_request:

jobs:
  setup:
    name: Setup Configuration
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.get-node-version.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Node version from package.json
        id: get-node-version
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "Error: package.json file not found"
            exit 1
          fi
          NODE_VERSION=$(jq -r '.engines.node' package.json)
          if [ -z "$NODE_VERSION" ] || [ "$NODE_VERSION" = "null" ]; then
            echo "Error: engines.node not found in package.json"
            exit 1
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "Detected Node version: $NODE_VERSION"

  node-build:
    name: Build & Cache Dependencies
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      # Cache dependencies to speed up workflow and reduce npm registry calls
      # Caches both node_modules and Cypress binary based on package-lock.json hash
      - name: node_modules and Cypress cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/
            ~/.cache/Cypress
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: [setup, node-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      # Restore cached dependencies from the build job
      - name: node_modules and Cypress cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/
            ~/.cache/Cypress
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      # Install dependencies if cache miss (fallback)
      - name: Install dependencies (if cache miss)
        run: npm ci --prefer-offline --no-audit

      # Validate TypeScript code for type errors without emitting output files
      # This catches type-related issues early in the PR process
      - name: Type check
        run: npm run typecheck

  indentation-check:
    name: Check Indentation
    runs-on: ubuntu-latest
    outputs:
      indent-size: ${{ steps.get-indent-size.outputs.indent_size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get indent size from .editorconfig
        id: get-indent-size
        run: |
          set -e
          if [ ! -f .editorconfig ]; then
            echo "Error: .editorconfig file not found"
            exit 1
          fi
          INDENT_SIZE=$(grep -E '^\s*indent_size\s*=' .editorconfig | head -n1 | cut -d'=' -f2 | tr -d ' ')
          if [ -z "$INDENT_SIZE" ]; then
            echo "Error: indent_size not found in .editorconfig"
            exit 1
          fi
          echo "indent_size=$INDENT_SIZE" >> $GITHUB_OUTPUT
          echo "Detected indent size: $INDENT_SIZE spaces"

      - name: Install editorconfig-checker
        run: |
          curl -O -L -C - https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.0.3/ec-linux-amd64.tar.gz
          tar xzf ec-linux-amd64.tar.gz
          chmod +x bin/ec-linux-amd64

      - name: Check indentation and formatting
        run: |
          ./bin/ec-linux-amd64 \
            --exclude "node_modules" \
            --exclude "package-lock.json" \
            --exclude "allure-results" \
            --exclude "allure-report" \
            --exclude "cypress/videos" \
            --exclude "cypress/screenshots"

  framework-verification:
    name: Validate ${{ matrix.framework }} Config
    runs-on: ubuntu-latest
    needs: [setup, node-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Cypress
            cache-path: |
              node_modules/
              ~/.cache/Cypress
            install-cmd: npm run cypress:install
            verify-cmd: npm run cypress:verify
          - framework: Playwright
            cache-path: node_modules/
            install-cmd: npm run playwright:install
            verify-cmd: npm run playwright:verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      # Restore cached dependencies from the build job
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json') }}

      # Install dependencies if cache miss (fallback)
      - name: Install dependencies (if cache miss)
        run: npm ci --prefer-offline --no-audit

      # Install framework binaries (Cypress binary or Playwright browsers)
      - name: Install ${{ matrix.framework }} binaries
        run: ${{ matrix.install-cmd }}

      # Verify framework configuration is valid
      - name: Verify ${{ matrix.framework }}
        run: ${{ matrix.verify-cmd }}

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [framework-verification, indentation-check, type-check]
    if: always()
    steps:
      # Generate a summary of all validation checks for easy PR review
      # This appears on the GitHub Actions summary page
      - name: Generate Summary
        run: |
          INDENT_SIZE="${{ needs.indentation-check.outputs.indent-size }}"
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.indentation-check.result }}" == "success" ]; then
            echo "✅ Indentation check passed ($INDENT_SIZE spaces)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Indentation check failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.type-check.result }}" == "success" ]; then
            echo "✅ TypeScript type check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ TypeScript type check failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.framework-verification.result }}" == "success" ]; then
            echo "✅ E2E framework configs valid (Cypress + Playwright)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ E2E framework config validation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Run the full test suite manually via **Actions → E2E Tests → Run workflow**" >> $GITHUB_STEP_SUMMARY
