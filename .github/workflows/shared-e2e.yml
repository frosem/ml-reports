name: Shared E2E Workflow

on:
  workflow_call:
    inputs:
      framework:
        description: 'Test framework (playwright or cypress)'
        required: true
        type: string
      tags:
        description: 'Tags to filter tests (use "all" to run everything)'
        required: false
        type: string
        default: 'all'
      deploy_dir:
        description: 'Reports Deployment directory'
        required: true
        type: string
      create_bug_reports:
        description: 'Create bug reports in Jira for failed tests'
        required: false
        type: boolean
        default: false
      show_permanent_link:
        description: 'Show permanent link in summary'
        required: false
        type: boolean
        default: false
    secrets:
      JIRA_API_TOKEN:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_PROJECT_KEY:
        required: false
      JIRA_USER_EMAIL:
        required: false

env:
  BRANCH_NAME: ${{ github.ref_name }}
  FRAMEWORK: ${{ inputs.framework }}
  RUN_ID: ${{ github.run_id }}

jobs:
  setup:
    name: Setup & Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.get-config.outputs.node_version }}
      shards: ${{ steps.get-config.outputs.shards }}
      shard-matrix: ${{ steps.get-config.outputs.matrix }}
      tags-valid: ${{ steps.validate-tags.outputs.valid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get configuration from package.json
        id: get-config
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "Error: package.json file not found"
            exit 1
          fi

          NODE_VERSION=$(jq -r '.engines.node' package.json)
          if [ -z "$NODE_VERSION" ] || [ "$NODE_VERSION" = "null" ]; then
            echo "Error: engines.node not found in package.json"
            exit 1
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "Node version: $NODE_VERSION"

          SHARDS=$(jq -r '.config.shards // 4' package.json)
          if [ "$SHARDS" -lt 1 ]; then SHARDS=1; fi
          if [ "$SHARDS" -gt 10 ]; then SHARDS=10; fi
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "Parallel runners: $SHARDS"

          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "Parallel runners: $SHARDS"

          MATRIX=$(seq 1 $SHARDS | jq -R -s -c 'split("\n") | map(select(length > 0) | tonumber)')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Validate tags exist
        id: validate-tags
        run: |
          FRAMEWORK="${{ inputs.framework }}"
          TAGS="${{ inputs.tags }}"

          # Skip validation if running all tests
          if [ -z "$TAGS" ] || [ "$TAGS" == "all" ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "Running all tests"
            exit 0
          fi

          if [ "$FRAMEWORK" == "playwright" ]; then
            TEST_DIR="playwright/tests"
            TAG_PATTERN="tag:\s*\["
          else
            TEST_DIR="cypress/e2e"
            TAG_PATTERN="tags:\s*\["
          fi

          AVAILABLE_TAGS=$(grep -rhE "$TAG_PATTERN" "$TEST_DIR" | grep -oE "'@[a-zA-Z0-9_-]+'" | tr -d "'" | sort -u | tr '\n' ' ')
          echo "Available tags: $AVAILABLE_TAGS"

          MISSING_TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            tag=$(echo "$tag" | xargs)
            if ! echo "$AVAILABLE_TAGS" | grep -qw "@$tag"; then
              MISSING_TAGS="$MISSING_TAGS $tag"
            fi
          done

          if [ -n "$MISSING_TAGS" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Tags not found:$MISSING_TAGS"
            echo ""
            echo "Available tags:"
            echo "$AVAILABLE_TAGS" | tr ' ' '\n' | grep -v '^$' | sort -u | sed 's/^/  /'
          else
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ All tags validated"
          fi

      - name: Tags Not Found Summary
        if: steps.validate-tags.outputs.valid == 'false'
        run: |
          FRAMEWORK="${{ inputs.framework }}"
          TAGS="${{ inputs.tags }}"

          if [ "$FRAMEWORK" == "cypress" ]; then
            FRAMEWORK_ICON='<img src="https://www.cypress.io/favicon.svg" alt="Cypress" width="20" height="20" />'
            FRAMEWORK_BADGE='![Cypress](https://img.shields.io/badge/-Cypress-69D3A7?logo=cypress&logoColor=white&style=flat-square)'
          else
            FRAMEWORK_ICON='<img src="https://playwright.dev/img/playwright-logo.svg" alt="Playwright" width="20" height="20" />'
            FRAMEWORK_BADGE='![Playwright](https://img.shields.io/badge/-Playwright-2EAD33?style=flat-square)'
          fi

          echo "# ⚠️ Tags Not Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${FRAMEWORK_BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | ${FRAMEWORK_ICON} \`${FRAMEWORK}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Requested Tags** | \`${TAGS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ env.BRANCH_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ❌ **The specified tag(s) were not found in the test files.**" >> $GITHUB_STEP_SUMMARY
          echo ">" >> $GITHUB_STEP_SUMMARY
          echo "> No tests were executed." >> $GITHUB_STEP_SUMMARY

  test:
    name: Run ${{ inputs.framework }} tests (${{ matrix.shard }}/${{ needs.setup.outputs.shards }})
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.tags-valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shard-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install and verify Playwright
        if: inputs.framework == 'playwright'
        run: |
          npm run playwright:install
          npm run playwright:verify

      - name: Install and verify Cypress
        if: inputs.framework == 'cypress'
        run: |
          npm run cypress:install
          npm run cypress:verify

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: |
          FRAMEWORK="${{ inputs.framework }}"
          TAGS="${{ inputs.tags }}"
          CURRENT="${{ matrix.shard }}"
          TOTAL="${{ needs.setup.outputs.shards }}"

          # Build allure-cli command
          CMD="npm run allure -- run ${FRAMEWORK} --shard=${CURRENT}/${TOTAL}"

          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            # Convert tags: smoke,medium -> @smoke,@medium
            FORMATTED_TAGS=$(echo "$TAGS" | sed 's/,/,@/g' | sed 's/^/@/')
            CMD="${CMD} --tags=${FORMATTED_TAGS}"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.framework }}-${{ matrix.shard }}
          path: |
            allure-results/suite/${{ inputs.framework }}/
            allure-results/on-demand/${{ inputs.framework }}/
          retention-days: 30

      - name: Upload Cypress artifacts
        if: inputs.framework == 'cypress' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.shard }}
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 7

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [setup, test]
    if: always() && needs.setup.outputs.tags-valid == 'true' && needs.test.result != 'cancelled'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all test results
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-${{ inputs.framework }}-*
          path: .
          merge-multiple: true

      - name: Get previous Allure history
        if: steps.download.outcome == 'success'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy previous history
        if: steps.download.outcome == 'success'
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          FRAMEWORK="${{ inputs.framework }}"
          TAGS="${{ inputs.tags }}"
          DEPLOY_DIR="${{ inputs.deploy_dir }}"
          HISTORY_DIR="gh-pages/${DEPLOY_DIR}/${SANITIZED_BRANCH}/${FRAMEWORK}"

          # Determine results dir: tags → on-demand, no tags → suite
          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            RESULTS_DIR="allure-results/on-demand/${FRAMEWORK}"
          else
            RESULTS_DIR="allure-results/suite/${FRAMEWORK}"
          fi

          if [ -d "$HISTORY_DIR" ]; then
            if [ "$DEPLOY_DIR" == "on-demand" ]; then
              LATEST_RUN=$(find "$HISTORY_DIR" -maxdepth 1 -type d -name '[0-9]*' | sort -n | tail -1)
              if [ -n "$LATEST_RUN" ] && [ -d "$LATEST_RUN/history" ]; then
                mkdir -p "${RESULTS_DIR}/history"
                cp -r "$LATEST_RUN/history"/* "${RESULTS_DIR}/history/" 2>/dev/null || true
                echo "Copied history from: $LATEST_RUN"
              fi
            else
              if [ -d "$HISTORY_DIR/history" ]; then
                mkdir -p "${RESULTS_DIR}/history"
                cp -r "$HISTORY_DIR/history"/* "${RESULTS_DIR}/history/" 2>/dev/null || true
                echo "Copied ${FRAMEWORK} history from previous report"
              else
                echo "No previous ${FRAMEWORK} history found"
              fi
            fi
          fi

      - name: Generate Allure Report
        if: steps.download.outcome == 'success'
        run: |
          TAGS="${{ inputs.tags }}"

          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            npm run allure -- generate ${{ inputs.framework }} --tags="${TAGS}"
          else
            npm run allure -- generate ${{ inputs.framework }}
          fi

      - name: Upload Allure Report
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.framework }}
          # Upload from both possible locations (only one will have content)
          path: |
            allure-report/suite/${{ inputs.framework }}/
            allure-report/on-demand/${{ inputs.framework }}/
          retention-days: 30

      - name: Create bug reports in Jira
        id: jira
        if: steps.download.outcome == 'success' && needs.test.result == 'failure' && inputs.create_bug_reports == true
        env:
          # Determine results dir: tags → on-demand, no tags → suite
          ALLURE_RESULTS_DIR: ${{ inputs.tags != '' && inputs.tags != 'all' && format('./allure-results/on-demand/{0}', inputs.framework) || format('./allure-results/suite/{0}', inputs.framework) }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        run: npm run jira:create-bugs

      # Deployment
      - name: Sanitize branch name
        id: sanitize
        if: steps.download.outcome == 'success'
        run: |
          SANITIZED_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//-/g')
          echo "branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Prepare deployment structure
        id: deploy-prep
        if: steps.download.outcome == 'success'
        run: |
          SANITIZED_BRANCH="${{ steps.sanitize.outputs.branch }}"
          FRAMEWORK="${{ inputs.framework }}"
          RUN_ID="${{ env.RUN_ID }}"
          TAGS="${{ inputs.tags }}"
          DEPLOY_DIR="${{ inputs.deploy_dir }}"
          ROOT_PATH="gh-pages/${DEPLOY_DIR}/${SANITIZED_BRANCH}/${FRAMEWORK}"

          # Determine report dir: tags → on-demand, no tags → suite
          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            REPORT_DIR="allure-report/on-demand/${FRAMEWORK}"
          else
            REPORT_DIR="allure-report/suite/${FRAMEWORK}"
          fi

          mkdir -p deploy-package

          mkdir -p "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}"
          cp -r "${REPORT_DIR}"/* "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}/"
          echo "✅ Report deployed to: ${SANITIZED_BRANCH}/${FRAMEWORK}/${RUN_ID}"

          if [ "${{ inputs.show_permanent_link }}" == "true" ]; then
            cp -r "${REPORT_DIR}"/* "deploy-package/${SANITIZED_BRANCH}/${FRAMEWORK}/"
            echo "✅ Root path updated with latest report"
          fi

          # Find previous run ID
          if [ -d "${ROOT_PATH}" ]; then
            PREVIOUS_RUN_ID=$(find "${ROOT_PATH}" -maxdepth 1 -type d -name '[0-9]*' | sort -n | tail -1 | xargs basename 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_RUN_ID" ]; then
              echo "previous_run_id=${PREVIOUS_RUN_ID}" >> $GITHUB_OUTPUT
              echo "📂 Found previous run: ${PREVIOUS_RUN_ID}"
            fi
          fi

      - name: Deploy to GitHub Pages
        if: steps.download.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v3
        with:
          destination_dir: ${{ inputs.deploy_dir }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_dir: ./deploy-package

      # Summary
      - name: Test Summary
        if: steps.download.outcome == 'success'
        run: |
          SANITIZED_BRANCH="${{ steps.sanitize.outputs.branch }}"
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.deploy_dir }}"
          FRAMEWORK="${{ inputs.framework }}"
          TAGS="${{ inputs.tags }}"
          PREVIOUS_RUN_ID="${{ steps.deploy-prep.outputs.previous_run_id }}"
          SHOW_PERMANENT="${{ inputs.show_permanent_link }}"
          CREATE_BUGS="${{ inputs.create_bug_reports }}"
          TEST_RESULT="${{ needs.test.result }}"

          # Framework badges
          if [ "$FRAMEWORK" == "cypress" ]; then
            FRAMEWORK_ICON='<img src="https://www.cypress.io/favicon.svg" alt="Cypress" width="20" height="20" />'
            FRAMEWORK_BADGE='![Cypress](https://img.shields.io/badge/-Cypress-69D3A7?logo=cypress&logoColor=white&style=flat-square)'
          else
            FRAMEWORK_ICON='<img src="https://playwright.dev/img/playwright-logo.svg" alt="Playwright" width="20" height="20" />'
            FRAMEWORK_BADGE='![Playwright](https://img.shields.io/badge/-Playwright-2EAD33?style=flat-square)'
          fi
          ALLURE_BADGE='![Allure](https://img.shields.io/badge/Allure-Reports-FF5722?style=flat-square)'

          # Header
          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            echo "# 🧪 Tests on Demand" >> $GITHUB_STEP_SUMMARY
          else
            echo "# 📊 E2E Test Reports" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${FRAMEWORK_BADGE} ${ALLURE_BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Info table
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | ${FRAMEWORK_ICON} \`${FRAMEWORK}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            echo "| **Tags** | \`${TAGS}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Branch** | \`${{ env.BRANCH_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Status
          if [ "$TEST_RESULT" == "success" ]; then
            echo "> ✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ **Some tests failed.** Check the report for details." >> $GITHUB_STEP_SUMMARY
            if [ "$CREATE_BUGS" == "true" ]; then
              ISSUE_LINKS="${{ steps.jira.outputs.issue_links }}"
              if [ -n "$ISSUE_LINKS" ]; then
                echo ">" >> $GITHUB_STEP_SUMMARY
                echo "> 📋 **Bug reports created in Jira:** ${ISSUE_LINKS}" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Report links
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ALLURE_ICON='<img src="https://avatars.githubusercontent.com/u/5879127" alt="Allure" width="20" height="20" />'
          echo "## ${ALLURE_ICON} Report Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🔗 [Report for this run](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK}/${{ env.RUN_ID }})" >> $GITHUB_STEP_SUMMARY
          echo ">" >> $GITHUB_STEP_SUMMARY

          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "> 📂 [Report for previous run](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK}/${PREVIOUS_RUN_ID})" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$SHOW_PERMANENT" == "true" ]; then
            echo "> 📊 [Latest report (permanent link)](${BASE_URL}/${SANITIZED_BRANCH}/${FRAMEWORK})" >> $GITHUB_STEP_SUMMARY
          fi

