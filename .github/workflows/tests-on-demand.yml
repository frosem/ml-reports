name: Tests on Demand

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Test framework'
        required: true
        default: 'playwright'
        type: choice
        options:
          - playwright
          - cypress
      tags:
        description: 'Tags to filter (comma-separated, use "all" to run everything). Examples: smoke | critical,high | high,cart,checkout'
        required: true
        type: string
        default: 'all'

permissions:
  contents: write

jobs:
  tests-on-demand:
    uses: ./.github/workflows/shared-e2e.yml
    with:
      framework: ${{ inputs.framework }}
      tags: ${{ inputs.tags }}
      deploy_dir: on-demand
      show_permanent_link: false
